name: Verify live mobile

on:
  push:
    paths:
      - '.github/workflows/verify-live-mobile.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Capture production mobile
        shell: bash
        run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('verify-live', {recursive:true});
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:390,height:844},locale:'pl-PL'});
          const page = await context.newPage();
          for (let i=0;i<15;i++) {
            try {
              const r = await page.goto('https://xn--przyda-8ib.pl/', {waitUntil:'networkidle',timeout:60000});
              if (r?.ok()) break;
            } catch {}
            await page.waitForTimeout(5000);
          }
          const h = await page.evaluate(()=>document.documentElement.scrollHeight);
          for (let y=0;y<h;y+=600){await page.evaluate(v=>scrollTo(0,v),y); await page.waitForTimeout(120);}
          await page.evaluate(()=>scrollTo(0,0)); await page.waitForTimeout(800);
          const state = await page.evaluate(()=>({
            height: document.documentElement.scrollHeight,
            comparisonOpen: document.querySelector('.comparison-details')?.hasAttribute('open') ?? null,
            comparisonToggleVisible: !!document.querySelector('.comparison-mobile-toggle') && getComputedStyle(document.querySelector('.comparison-mobile-toggle')).display !== 'none',
            operationImage: {w: document.querySelector('img[src="/showcase-operations.webp"]')?.naturalWidth || 0, h: document.querySelector('img[src="/showcase-operations.webp"]')?.naturalHeight || 0},
            businessImage: {w: document.querySelector('img[src="/showcase-business.webp"]')?.naturalWidth || 0, h: document.querySelector('img[src="/showcase-business.webp"]')?.naturalHeight || 0}
          }));
          fs.writeFileSync('verify-live/state.json', JSON.stringify(state,null,2));
          await page.screenshot({path:'verify-live/mobile-390.png',fullPage:true});
          await browser.close();
          EOF
          node verify.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: verify-live-mobile
          path: verify-live/
          retention-days: 2
