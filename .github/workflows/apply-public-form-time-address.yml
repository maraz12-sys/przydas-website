name: Apply public form time/address

on:
  push:
    paths:
      - 'scripts/upgrade-public-form-time-address.mjs'
      - '.github/workflows/apply-public-form-time-address.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply form upgrade
        run: node scripts/upgrade-public-form-time-address.mjs

      - name: Build
        run: |
          npm install
          npm run build

      - name: Commit generated update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/formularz.astro .github/workflows/visual-audit.yml
          git commit -m "Improve reservation form time and address fields"
          git push
