name: Apply sales and language audit fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-sales-language-audit.mjs'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Apply audited copy fixes
        run: node scripts/apply-sales-language-audit.mjs

      - name: Install dependencies
        run: npm install

      - name: Build production website
        run: npm run build

      - name: Validate corrected sales claims
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Magazyn do 3 kategorii' src/components/PackagesSection.astro
          ! grep -q 'Magazyn do 5 kategorii' src/components/PackagesSection.astro
          grep -q "\['Zadania dla członków zespołu', '—', '—', '✓'\]" src/components/FinalSections.astro
          grep -q "\['Garderoba i informacje pracownicze', '—', '—', '✓'\]" src/components/FinalSections.astro
          grep -q "'W przygotowaniu'" src/components/FinalSections.astro
          grep -q '60 dni BIZNES za 0 zł' src/components/PackagesSection.astro
          grep -q 'Chcę uruchomić bezpłatny test' src/components/FinalSections.astro
          ! grep -q 'Publiczny start dla nowych firm jest kolejnym krokiem' src/components/FinalSections.astro
          ! grep -q 'Dane i pliki są objęte osobnymi mechanizmami kopii zapasowych' src/pages/bezpieczenstwo.astro

      - name: Commit audited website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro src/pages/bezpieczenstwo.astro src/pages/polityka-prywatnosci.astro src/layouts/LegalLayout.astro
          git add src/components/LandingTop.astro src/components/ProductShowcase.astro src/components/PackagesSection.astro src/components/FinalSections.astro src/components/LegalFooter.astro
          git rm scripts/apply-sales-language-audit.mjs .github/workflows/apply-sales-language-audit.yml
          git commit -m "Fix sales claims, conversion path and Polish copy"
          git push origin main
