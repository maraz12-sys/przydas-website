name: Reconcile product claims

on:
  push:
    paths:
      - 'scripts/reconcile-product-claims.mjs'
      - '.github/workflows/reconcile-product-claims.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/reconcile-product-claims.mjs
      - run: npm install
      - run: npm run build
      - name: Commit generated update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LandingTop.astro src/components/PackagesSection.astro src/components/FinalSections.astro
          git commit -m "Align website claims with current product status"
          git push
