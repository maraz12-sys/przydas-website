name: Apply package pricing 249 and UX audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-pricing-249-audit.yml'

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Apply pricing and packaging patch
        run: python3 scripts/package-pricing-249-audit.py

      - name: Install dependencies
        run: npm install

      - name: Build production site
        run: npm run build

      - name: Validate pricing, package split and copy
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q '249 zł' dist/index.html
          grep -q '2 490 zł' dist/index.html
          grep -q 'Rozliczenia pracowników według własnych stawek' dist/index.html
          grep -q 'Zadania dla członków zespołu' dist/index.html
          grep -q 'Garderoba i informacje pracownicze' dist/index.html
          grep -q 'Do 3 kategorii' dist/index.html
          grep -q 'Zarządzanie uprawnieniami ról' dist/index.html
          grep -q 'Koniec ze żmudnym rozliczaniem pracowników' dist/index.html
          grep -q 'To, czego dziś pilnujesz ręcznie' dist/index.html
          ! grep -q '199 zł / mies.' dist/index.html
          ! grep -q '1 990 zł' dist/index.html
          ! grep -q 'To, co dziś pilnujesz ręcznie' dist/index.html

      - name: Remove one-time migration files
        run: rm -f scripts/package-pricing-249-audit.py .github/workflows/package-pricing-249-audit.yml

      - name: Commit audited landing page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PackagesSection.astro src/components/FinalSections.astro src/components/LandingTop.astro src/components/ProductShowcase.astro src/pages/index.astro scripts/package-pricing-249-audit.py .github/workflows/package-pricing-249-audit.yml
          git commit -m 'Update packages to 59 149 249 and audit landing UX'
          git push
