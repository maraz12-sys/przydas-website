name: Apply public form order

on:
  push:
    paths:
      - 'scripts/reorder-public-form-fields.mjs'
      - '.github/workflows/apply-public-form-order.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reorder public form fields
        run: node scripts/reorder-public-form-fields.mjs

      - name: Build
        run: |
          npm install
          npm run build

      - name: Commit form update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No form changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/formularz.astro
          git commit -m "Reorder public reservation form fields logically"
          git push
