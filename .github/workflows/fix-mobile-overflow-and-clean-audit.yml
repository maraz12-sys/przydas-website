name: Fix landing mobile overflow and clean audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-overflow-and-clean-audit.yml'

permissions:
  contents: write

jobs:
  fix-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix decorative mobile overflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/LandingTop.astro')
          s=p.read_text(encoding='utf-8')
          old='.visual-glow { position: absolute; z-index: -1; inset: 12% -6% -7% 10%;'
          new='.visual-glow { position: absolute; z-index: -1; inset: 12% 0 -7% 10%;'
          if s.count(old)!=1:
              raise SystemExit(f'Expected one visual-glow rule, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install and build
        run: |
          npm install
          npm install playwright@1.55.0 --no-save
          npm run build
          npx playwright install --with-deps chromium

      - name: Serve build
        run: |
          npx --yes http-server dist -p 4173 -c-1 > /tmp/http-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/http-server.log
          exit 1

      - name: Verify mobile and desktop layout
        shell: bash
        run: |
          mkdir -p layout-diagnostics
          cat > /tmp/check-layout.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const results=[];
          const issues=[];
          for (const v of [{w:390,h:844,name:'mobile'},{w:1440,h:1100,name:'desktop'}]) {
            const ctx=await browser.newContext({viewport:{width:v.w,height:v.h},locale:'pl-PL'});
            const p=await ctx.newPage();
            await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            const m=await p.evaluate(()=>{
              const overflow=Array.from(document.querySelectorAll('body *')).filter(el=>{
                const style=getComputedStyle(el);
                if(style.position==='fixed') return false;
                const r=el.getBoundingClientRect();
                return r.right>window.innerWidth+2||r.left<-2;
              }).slice(0,30).map(el=>{
                const r=el.getBoundingClientRect();
                return {tag:el.tagName,cls:el.className?.toString?.()||'',left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),text:(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,100)};
              });
              return {
                innerWidth:window.innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                overflow,
                business:Array.from(document.querySelectorAll('.package-card')).find(c=>c.querySelector('.package-name')?.textContent?.trim()==='BIZNES')?.querySelector('.package-price-row.monthly-only .package-price')?.textContent?.trim(),
                cards:Array.from(document.querySelectorAll('.package-card')).length,
                old199:(document.body.innerText.match(/199 zł/g)||[]).length
              };
            });
            results.push({viewport:v,metrics:m});
            if(m.scrollWidth>m.innerWidth+2) issues.push(`${v.name}: horizontal overflow ${m.scrollWidth}/${m.innerWidth}`);
            if(m.cards!==3||m.business!=='249 zł'||m.old199!==0) issues.push(`${v.name}: pricing regression`);
            await p.screenshot({path:`layout-diagnostics/${v.name}.png`,fullPage:true});
            await ctx.close();
          }
          await browser.close();
          fs.writeFileSync('layout-diagnostics/metrics.json',JSON.stringify({results,issues},null,2));
          console.log(JSON.stringify({results,issues},null,2));
          if(issues.length) process.exitCode=1;
          EOF
          node /tmp/check-layout.mjs

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-layout-diagnostics
          path: layout-diagnostics/*
          retention-days: 7

      - name: Clean temporary audit workflows
        run: rm -f .github/workflows/landing-visual-audit-249.yml .github/workflows/fix-mobile-overflow-and-clean-audit.yml

      - name: Commit final audited state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/LandingTop.astro .github/workflows/landing-visual-audit-249.yml .github/workflows/fix-mobile-overflow-and-clean-audit.yml
          git commit -m 'Fix mobile landing overflow after pricing audit'
          git push
