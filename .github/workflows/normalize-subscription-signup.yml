name: Normalize subscription signup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize-subscription-signup.mjs'
      - '.github/workflows/normalize-subscription-signup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize self-service trial CTAs
        run: node scripts/normalize-subscription-signup.mjs

      - name: Install dependencies
        run: npm ci

      - name: Subscription readiness audit and build
        run: npm run build

      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/components/PackagesSection.astro src/components/FinalSections.astro; then
            echo "No source normalization required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PackagesSection.astro src/components/FinalSections.astro
          git commit -m "Enable automated self-service trial CTAs"
          git push
