name: Materialize landing source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Materialize assembled landing page
        shell: bash
        run: |
          if [ ! -f scripts/assemble_landing_page.js ]; then
            echo "Assembler already removed. Nothing to do."
            exit 0
          fi
          node scripts/assemble_landing_page.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts.build = 'astro build';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          rm scripts/assemble_landing_page.js

      - name: Commit stable Astro source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro package.json scripts/assemble_landing_page.js
          git commit -m "Materialize complete landing page source"
          git push
