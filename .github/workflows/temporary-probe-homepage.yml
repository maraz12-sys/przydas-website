name: Temporary probe homepage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-probe-homepage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe current homepage state
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://xn--przyda-8ib.pl/" "https://www.xn--przyda-8ib.pl/"; do
            out="$(mktemp)"
            status="$(curl -L -sS -o "$out" -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
            holding=false
            full=false
            grep -q 'Już za chwilę startujemy' "$out" && holding=true || true
            grep -q 'Mniej pilnowania' "$out" && full=true || true
            echo "STATE url=$url status=$status holding=$holding full=$full bytes=$(wc -c < "$out")"
            rm -f "$out"
          done
