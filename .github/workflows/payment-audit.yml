name: Payment Audit

on:
  push:
    paths:
      - 'src/pages/formularz.astro'
      - '.github/workflows/payment-audit.yml'
  workflow_dispatch:

jobs:
  payment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install and build
        run: |
          npm install
          npm install playwright@1.55.0 --no-save
          npm run build
          npx playwright install --with-deps chromium
      - name: Serve
        run: |
          npx --yes http-server dist -p 4173 -c-1 >/tmp/server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/server.log
          exit 1
      - name: Verify payment choice
        run: |
          mkdir -p payment-audit
          cat > payment-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:900},locale:'pl-PL'});
          const page=await context.newPage();
          let submitted=null;
          await page.route('**/functions/v1/formularz-rezerwacyjny-publiczny',async route=>{
            const payload=JSON.parse(route.request().postData()||'{}');
            if(payload.action==='submit'){
              submitted=payload;
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,submitted:true})});
            }
            return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
              ok:true,organization_name:'Animilandia',template_name:'Test płatności',completed:false,
              fields:[{key:'sposob_platnosci',label:'Sposób płatności',type:'text',required:true}]
            })});
          });
          await page.goto('http://127.0.0.1:4173/formularz/?t=1234567890123456789012345678901234567890',{waitUntil:'domcontentloaded'});
          await page.locator('#reservation-form').waitFor({state:'visible'});
          const options=page.locator('input[type="radio"][name="sposob_platnosci"]');
          if(await options.count()!==2) throw new Error(`Oczekiwano 2 opcji płatności, jest ${await options.count()}`);
          const gotowka=page.locator('input[name="sposob_platnosci"][value="gotowka"]');
          const przelew=page.locator('input[name="sposob_platnosci"][value="przelew"]');
          if(!(await gotowka.count())||!(await przelew.count())) throw new Error('Brakuje opcji Gotówka/Przelew');
          await gotowka.check();
          if(!(await gotowka.isChecked())||await przelew.isChecked()) throw new Error('Gotówka nie działa jako pojedynczy wybór');
          await przelew.check();
          if(await gotowka.isChecked()||!(await przelew.isChecked())) throw new Error('Opcje pozwalają na niejednoznaczny wybór');
          await page.screenshot({path:'payment-audit/payment-desktop.png',fullPage:true});
          await page.locator('button.submit').click();
          await page.waitForTimeout(300);
          if(submitted?.answers?.sposob_platnosci!=='przelew') throw new Error(`Backend dostał nieprawidłową wartość: ${JSON.stringify(submitted)}`);
          console.log('PASS: single-choice payment -> canonical value przelew');
          await browser.close();
          EOF
          node payment-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-audit
          path: payment-audit/*.png
          retention-days: 7
