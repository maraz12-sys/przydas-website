name: Landing visual audit 59 149 249

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/landing-visual-audit-249.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: |
          npm install
          npm install playwright@1.55.0 --no-save

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve build
        run: |
          npx --yes http-server dist -p 4173 -c-1 > /tmp/http-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/http-server.log
          exit 1

      - name: Audit landing layout and capture screenshots
        shell: bash
        run: |
          mkdir -p landing-audit
          cat > landing-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const results = [];

          for (const viewport of [{name:'desktop-1440',width:1440,height:1100},{name:'mobile-390',width:390,height:844}]) {
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height }, locale: 'pl-PL' });
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });

            const metrics = await page.evaluate(() => {
              const root = document.documentElement;
              const overflow = Array.from(document.querySelectorAll('body *')).filter(el => {
                const r = el.getBoundingClientRect();
                return r.right > window.innerWidth + 2 || r.left < -2;
              }).slice(0,20).map(el => ({tag:el.tagName,cls:el.className?.toString?.()||'',text:(el.textContent||'').trim().slice(0,80),rect:el.getBoundingClientRect().toJSON()}));
              const packageCards = Array.from(document.querySelectorAll('.package-card')).map(card => ({
                name: card.querySelector('.package-name')?.textContent?.trim(),
                price: card.querySelector('.package-price-row.monthly-only .package-price')?.textContent?.trim(),
                detailsOpen: card.querySelector('details')?.hasAttribute('open') ?? null,
                height: Math.round(card.getBoundingClientRect().height),
              }));
              const comparison = document.querySelector('.comparison-details');
              const heroPrimary = document.querySelector('.hero-actions .button-primary');
              return {
                innerWidth: window.innerWidth,
                scrollWidth: root.scrollWidth,
                bodyHeight: Math.round(document.body.getBoundingClientRect().height),
                overflow,
                packageCards,
                comparisonOpen: comparison?.hasAttribute('open') ?? null,
                heroPrimaryText: heroPrimary?.textContent?.replace(/\s+/g,' ').trim() || '',
                businessPriceOccurrences: (document.body.innerText.match(/249 zł/g)||[]).length,
                oldPriceOccurrences: (document.body.innerText.match(/199 zł/g)||[]).length,
              };
            });

            if (metrics.scrollWidth > metrics.innerWidth + 2) throw new Error(`${viewport.name}: horizontal overflow ${metrics.scrollWidth} > ${metrics.innerWidth}; ${JSON.stringify(metrics.overflow)}`);
            if (metrics.packageCards.length !== 3) throw new Error(`${viewport.name}: expected 3 package cards`);
            if (!metrics.packageCards.every(x => x.detailsOpen === true)) throw new Error(`${viewport.name}: package details should remain open for easier comparison`);
            if (!metrics.packageCards.some(x => x.name === 'BIZNES' && x.price === '249 zł')) throw new Error(`${viewport.name}: BIZNES 249 zł missing`);
            if (metrics.oldPriceOccurrences !== 0) throw new Error(`${viewport.name}: stale 199 zł copy remains`);
            if (!/Sprawdź, ile to kosztuje/i.test(metrics.heroPrimaryText)) throw new Error(`${viewport.name}: primary hero CTA missing`);

            await page.screenshot({ path: `landing-audit/${viewport.name}.png`, fullPage: true });
            results.push({viewport, metrics});
            await context.close();
          }

          fs.writeFileSync('landing-audit/metrics.json', JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          await browser.close();
          EOF
          node landing-audit.mjs

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-visual-audit-249
          path: landing-audit/*
          retention-days: 7
