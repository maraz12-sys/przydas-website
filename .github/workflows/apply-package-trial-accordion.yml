name: Apply package trial accordion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-package-trial-accordion.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Apply website changes
        run: python3 scripts/apply_package_trial.py
      - name: Build and install browser
        run: |
          npm install
          npm install playwright@1.55.0 --no-save
          npm run build
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npx --yes http-server dist -p 4173 -c-1 > /tmp/http-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/http-server.log
          exit 1
      - name: Audit desktop and mobile
        run: node scripts/package_audit.mjs
      - name: Export patched source files
        uses: actions/upload-artifact@v4
        with:
          name: package-trial-website-source
          path: |
            src/components/PackagesSection.astro
            src/components/FinalSections.astro
          retention-days: 1
