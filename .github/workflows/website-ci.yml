name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Build landing page
        run: npm run build

      - name: Validate generated site
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/index.html
          test -s dist/404.html
          test -s dist/formularz/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/_headers

          grep -q 'Mniej pilnowania' dist/index.html
          grep -q 'Program kosztuje' dist/index.html
          grep -q 'START' dist/index.html
          grep -q 'ZESPÓŁ' dist/index.html
          grep -q 'BIZNES' dist/index.html
          grep -q 'Przypomnienia o ponownym kontakcie' dist/index.html
          grep -q 'FAQPage' dist/index.html
          grep -q 'app.xn--przyda-8ib.pl' dist/index.html
          grep -q 'canonical' dist/index.html
          grep -q 'SoftwareApplication' dist/index.html
          grep -q 'xn--przyda-8ib.pl/sitemap.xml' dist/robots.txt
          grep -q 'xn--przyda-8ib.pl' dist/sitemap.xml
          grep -q 'Content-Security-Policy' dist/_headers
          grep -q "connect-src 'self' https://jyzajgbgkqlczjpoxxzt.supabase.co" dist/_headers
          grep -q 'formularz-rezerwacyjny-publiczny' dist/formularz/index.html
          grep -q 'X-Robots-Tag: noindex' dist/_headers

# CI validates the assembled production landing page, conversion-critical copy,
# structured data, SEO files, public form API access, security headers and custom error routing.
