name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Build landing page
        run: npm run build

      - name: Validate generated site
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/index.html
          test -s dist/404.html
          test -s dist/formularz/index.html
          test -s dist/kontakt/index.html
          test -s dist/regulamin/index.html
          test -s dist/polityka-prywatnosci/index.html
          test -s dist/cookies/index.html
          test -s dist/podprocesorzy/index.html
          test -s dist/bezpieczenstwo/index.html
          test -s dist/umowa-powierzenia/index.html
          test -s dist/zglos-nielegalna-tresc/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/_headers

          grep -q 'Mniej pilnowania' dist/index.html
          grep -q 'Program kosztuje' dist/index.html
          grep -q 'START' dist/index.html
          grep -q 'ZESPÓŁ' dist/index.html
          grep -q 'BIZNES' dist/index.html
          grep -q 'Przypomnienia o ponownym kontakcie' dist/index.html
          grep -q 'FAQPage' dist/index.html
          grep -q 'app.xn--przyda-8ib.pl' dist/index.html
          grep -q 'canonical' dist/index.html
          grep -q 'SoftwareApplication' dist/index.html
          grep -q 'xn--przyda-8ib.pl/sitemap.xml' dist/robots.txt
          grep -q 'xn--przyda-8ib.pl' dist/sitemap.xml
          grep -q 'Content-Security-Policy' dist/_headers
          grep -q "connect-src 'self' https://jyzajgbgkqlczjpoxxzt.supabase.co" dist/_headers
          grep -q 'formularz-rezerwacyjny-publiczny' dist/formularz/index.html
          grep -q 'form-card' dist/formularz/index.html
          grep -q 'form-intro' dist/formularz/index.html
          grep -q 'X-Robots-Tag: noindex' dist/_headers

          # Commercial truth gates.
          grep -q 'Magazyn do 3 kategorii' dist/index.html
          ! grep -q 'Magazyn do 5 kategorii' dist/index.html
          grep -q 'Zadania zespołu, garderoba i checklisty materiałowe' dist/index.html
          grep -q 'Szanse sprzedażowe: potencjalne stałe współprace i imprezy prywatne' dist/index.html
          grep -q 'W przygotowaniu' dist/index.html
          grep -q '60 dni BIZNES za 0 zł' dist/index.html
          grep -q 'Chcę uruchomić bezpłatny test' dist/index.html
          ! grep -q 'Publiczny start dla nowych firm jest kolejnym krokiem' dist/index.html

          # Legal identity gates.
          grep -q 'Ewelina Nalewalska ANIMILANDIA' dist/index.html
          grep -q '5621808600' dist/index.html
          grep -q '368796206' dist/index.html
          grep -q 'Boczna 23' dist/index.html
          grep -q 'Ewelina Nalewalska ANIMILANDIA' dist/kontakt/index.html
          grep -q 'Władysława Jagiełły 6' dist/kontakt/index.html
          grep -q 'Boczna 23' dist/kontakt/index.html

          # Contract/legal release gates.
          grep -q 'Uruchomienie Okresu próbnego nie powoduje automatycznego przejścia na płatną Subskrypcję' dist/regulamin/index.html
          grep -q 'pierwsze 10 kwalifikujących się nowych Organizacji' dist/regulamin/index.html
          grep -q '8 września 2026' dist/regulamin/index.html
          grep -q '14 dni' dist/regulamin/index.html
          grep -q 'obowiązku zapłaty' dist/regulamin/index.html
          grep -q '/umowa-powierzenia' dist/regulamin/index.html
          grep -q 'art. 28 RODO' dist/umowa-powierzenia/index.html
          grep -q 'udokumentowane polecenie' dist/umowa-powierzenia/index.html
          grep -q 'podprocesor' dist/umowa-powierzenia/index.html
          grep -q 'audyt' dist/umowa-powierzenia/index.html
          grep -q 'Administrator danych' dist/polityka-prywatnosci/index.html
          grep -q 'art. 6 ust. 1 lit. f RODO' dist/polityka-prywatnosci/index.html
          grep -q 'Skąd otrzymujemy dane' dist/polityka-prywatnosci/index.html
          grep -q 'art. 399 Prawa komunikacji elektronicznej' dist/cookies/index.html
          grep -q 'nie używamy opcjonalnych narzędzi analitycznych ani marketingowych' dist/cookies/index.html
          grep -q 'Plus Five Five, Inc. (Resend)' dist/podprocesorzy/index.html
          grep -q 'WEWEB SAS' dist/podprocesorzy/index.html
          grep -q 'Zgłoszenie nielegalnej treści' dist/zglos-nielegalna-tresc/index.html
          grep -q 'w dobrej wierze' dist/zglos-nielegalna-tresc/index.html
          grep -q 'umowa-powierzenia' dist/sitemap.xml
          grep -q 'zglos-nielegalna-tresc' dist/sitemap.xml

          ! grep -Rqi 'Dokument przed uruchomieniem' dist
          ! grep -Rqi 'dane identyfikacyjne operatora.*zostaną uzupełnione' dist
          ! grep -Rqi 'przed komercyjnym startem' dist
          ! grep -Rqi 'przed sprzedażą komercyjną' dist
          ! grep -Rqi 'przed płatnym startem' dist

# CI validates the public site, commercial plan claims, legal identity,
# trial/subscription disclosures, GDPR/DPA, PKE storage disclosure, DSA notice
# mechanism, SEO files, security headers and public form routing.
