name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Build landing page
        run: npm run build

      - name: Validate generated site
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/index.html
          test -s dist/404.html
          test -s dist/formularz/index.html
          test -s dist/kontakt/index.html
          test -s dist/regulamin/index.html
          test -s dist/polityka-prywatnosci/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/_headers

          grep -q 'Mniej pilnowania' dist/index.html
          grep -q 'Program kosztuje' dist/index.html
          grep -q 'START' dist/index.html
          grep -q 'ZESPÓŁ' dist/index.html
          grep -q 'BIZNES' dist/index.html
          grep -q 'Przypomnienia o ponownym kontakcie' dist/index.html
          grep -q 'FAQPage' dist/index.html
          grep -q 'app.xn--przyda-8ib.pl' dist/index.html
          grep -q 'canonical' dist/index.html
          grep -q 'SoftwareApplication' dist/index.html
          grep -q 'xn--przyda-8ib.pl/sitemap.xml' dist/robots.txt
          grep -q 'xn--przyda-8ib.pl' dist/sitemap.xml
          grep -q 'Content-Security-Policy' dist/_headers
          grep -q "connect-src 'self' https://jyzajgbgkqlczjpoxxzt.supabase.co" dist/_headers
          grep -q 'formularz-rezerwacyjny-publiczny' dist/formularz/index.html
          grep -q 'form-card' dist/formularz/index.html
          grep -q 'form-intro' dist/formularz/index.html
          grep -q 'X-Robots-Tag: noindex' dist/_headers

          # Commercial truth gates: keep website copy aligned with the live plan contract.
          grep -q 'Magazyn do 3 kategorii' dist/index.html
          ! grep -q 'Magazyn do 5 kategorii' dist/index.html
          grep -q 'Zadania zespołu, garderoba i checklisty materiałowe' dist/index.html
          grep -q 'Szanse sprzedażowe: potencjalne stałe współprace i imprezy prywatne' dist/index.html
          grep -q 'W przygotowaniu' dist/index.html
          grep -q '60 dni BIZNES za 0 zł' dist/index.html
          grep -q 'Chcę uruchomić bezpłatny test' dist/index.html
          ! grep -q 'Publiczny start dla nowych firm jest kolejnym krokiem' dist/index.html

          # Legal identity gates: never publish an anonymous SaaS operator again.
          grep -q 'Ewelina Nalewalska ANIMILANDIA' dist/index.html
          grep -q '5621808600' dist/index.html
          grep -q '368796206' dist/index.html
          grep -q 'Boczna 23' dist/index.html
          grep -q 'Ewelina Nalewalska ANIMILANDIA' dist/kontakt/index.html
          grep -q 'Władysława Jagiełły 6' dist/kontakt/index.html
          grep -q 'Boczna 23' dist/kontakt/index.html
          grep -q '5621808600' dist/regulamin/index.html
          grep -q '368796206' dist/regulamin/index.html
          grep -q 'Administrator danych' dist/polityka-prywatnosci/index.html
          grep -q '5621808600' dist/polityka-prywatnosci/index.html

          ! grep -Rqi 'Dokument przed uruchomieniem' dist
          ! grep -Rqi 'dane identyfikacyjne operatora.*zostaną uzupełnione' dist
          ! grep -Rqi 'przed komercyjnym startem' dist
          ! grep -Rqi 'przed sprzedażą komercyjną' dist
          ! grep -Rqi 'przed płatnym startem' dist

# CI validates the assembled production landing page, conversion-critical copy,
# commercial plan claims, published operator identity, structured data, SEO files,
# public form API access, tester-facing copy, security headers and custom error routing.
