name: Subscription readiness

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/test.astro'
      - 'src/components/PackagesSection.astro'
      - 'src/components/FinalSections.astro'
      - 'scripts/normalize-subscription-signup.mjs'
      - 'scripts/audit-subscription-readiness.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/subscription-readiness.yml'
  pull_request:
    paths:
      - 'src/pages/test.astro'
      - 'src/components/PackagesSection.astro'
      - 'src/components/FinalSections.astro'
      - 'scripts/normalize-subscription-signup.mjs'
      - 'scripts/audit-subscription-readiness.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscription-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize trial CTAs
        run: node scripts/normalize-subscription-signup.mjs

      - name: Verify source is normalized
        run: git diff --exit-code -- src/components/PackagesSection.astro src/components/FinalSections.astro

      - name: Audit subscription frontend contract
        run: node scripts/audit-subscription-readiness.mjs

      - name: Build website
        run: npx astro build
