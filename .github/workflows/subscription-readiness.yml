name: Subscription readiness

on:
  push:
    branches: [main]
    paths:
      - '.node-version'
      - '.nvmrc'
      - 'src/pages/test.astro'
      - 'src/pages/regulamin.astro'
      - 'src/pages/polityka-prywatnosci.astro'
      - 'src/pages/platnosci.astro'
      - 'src/pages/kontakt.astro'
      - 'src/components/LegalFooter.astro'
      - 'public/sitemap.xml'
      - 'src/components/PackagesSection.astro'
      - 'src/components/FinalSections.astro'
      - 'scripts/normalize-subscription-signup.mjs'
      - 'scripts/audit-subscription-readiness.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/subscription-readiness.yml'
  pull_request:
    paths:
      - '.node-version'
      - '.nvmrc'
      - 'src/pages/test.astro'
      - 'src/components/PackagesSection.astro'
      - 'src/components/FinalSections.astro'
      - 'scripts/normalize-subscription-signup.mjs'
      - 'scripts/audit-subscription-readiness.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscription-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify pinned Node runtime and engine metadata
        run: node -e "const fs=require('node:fs'),v=fs.readFileSync('.node-version','utf8').trim(),p=require('./package.json'),l=require('./package-lock.json');if(!/^24\.[0-9]+\.[0-9]+$/.test(v)||process.versions.node!==v||p.engines?.node!=='>='+v+' <25'||l.packages[''].engines?.node!==p.engines.node||fs.existsSync('.nvmrc')&&fs.readFileSync('.nvmrc','utf8').trim()!==v)throw Error('Node runtime/engine pin drift')"
      - name: Install dependencies
        run: npm ci

      - name: Normalize trial CTAs
        run: node scripts/normalize-subscription-signup.mjs

      - name: Verify source is normalized
        run: git diff --exit-code -- src/components/PackagesSection.astro src/components/FinalSections.astro

      - name: Audit subscription frontend contract
        run: node scripts/audit-subscription-readiness.mjs

      - name: Build website
        run: npx astro build
