name: Import real showcase assets

on:
  push:
    paths:
      - '.github/workflows/import-real-showcase-assets.yml'

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download real Przydaś screenshots
        shell: bash
        run: |
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-24a8-81f4-9e64-11b435392d9b/raw?se=2026-08-25T12%3A15%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=5c690c68-ce3a-56f6-b6fc-a58d5b75e390&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-25T07%3A59%3A25Z&ske=2026-08-26T07%3A59%3A25Z&sks=b&skv=2026-02-06&sig=3F15v0qxUwimsr%2BHpaCn/xq7B8hi/R9rGfitrJNieG8%3D' -o /tmp/screens.zip
          mkdir -p /tmp/real-screens
          unzip -q /tmp/screens.zip -d /tmp/real-screens
          find /tmp/real-screens -maxdepth 2 -type f -print

      - name: Build clean marketing compositions
        run: |
          python -m pip install pillow >/dev/null
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path

          root = Path('/tmp/real-screens')
          public = Path('public')
          public.mkdir(exist_ok=True)

          def find(name):
              found = list(root.rglob(name))
              if not found:
                  raise FileNotFoundError(name)
              return found[0]

          calendar = Image.open(find('02-kalendarz.png')).convert('RGB').crop((0, 0, 1440, 900))
          reservation = Image.open(find('03-szczegoly.png')).convert('RGB').crop((1060, 115, 1438, 880))
          settlements = Image.open(find('04-rozliczenie.png')).convert('RGB').crop((35, 70, 1395, 870))
          statistics = Image.open(find('05-statystyki.png')).convert('RGB').crop((25, 70, 1400, 900))
          contacts = Image.open(find('06-klienci-do-kontaktu.png')).convert('RGB').crop((25, 70, 1400, 900))

          BG = (247, 250, 248, 255)

          def rounded(im, radius=22):
              mask = Image.new('L', im.size, 0)
              d = ImageDraw.Draw(mask)
              d.rounded_rectangle((0, 0, im.width - 1, im.height - 1), radius=radius, fill=255)
              rgba = im.convert('RGBA')
              rgba.putalpha(mask)
              return rgba

          def paste_card(canvas, im, xy, radius=20, shadow=16):
              x, y = xy
              sw = Image.new('RGBA', (im.width + shadow * 4, im.height + shadow * 4), (0, 0, 0, 0))
              sd = ImageDraw.Draw(sw)
              sd.rounded_rectangle((shadow * 2, shadow * 2, shadow * 2 + im.width, shadow * 2 + im.height), radius=radius, fill=(20, 50, 38, 44))
              sw = sw.filter(ImageFilter.GaussianBlur(shadow))
              canvas.alpha_composite(sw, (x - shadow * 2, y - shadow * 2))
              card = rounded(im, radius)
              border = Image.new('RGBA', card.size, (0, 0, 0, 0))
              bd = ImageDraw.Draw(border)
              bd.rounded_rectangle((0, 0, card.width - 1, card.height - 1), radius=radius, outline=(218, 230, 224, 255), width=2)
              canvas.alpha_composite(card, (x, y))
              canvas.alpha_composite(border, (x, y))

          # Operations: authentic calendar + authentic reservation panel; WeWeb overlays are outside the crops.
          c = Image.new('RGBA', (1400, 850), BG)
          d = ImageDraw.Draw(c)
          d.ellipse((-180, -220, 520, 480), fill=(223, 246, 235, 150))
          d.ellipse((1050, 430, 1550, 930), fill=(233, 249, 241, 190))
          cal = calendar.resize((1040, 650), Image.LANCZOS)
          res = reservation.resize((310, 627), Image.LANCZOS)
          paste_card(c, cal, (50, 90), 24, 16)
          paste_card(c, res, (1040, 145), 24, 16)
          c.convert('RGB').save(public / 'showcase-operations.webp', 'WEBP', quality=86, method=6)

          # Business: authentic settlements, statistics and customer follow-up views.
          c = Image.new('RGBA', (1400, 900), BG)
          d = ImageDraw.Draw(c)
          d.ellipse((-220, 480, 500, 1120), fill=(230, 248, 239, 180))
          d.ellipse((980, -220, 1600, 400), fill=(223, 246, 235, 150))
          sett = settlements.resize((760, 447), Image.LANCZOS)
          stats = statistics.resize((520, 314), Image.LANCZOS)
          cont = contacts.resize((1040, 628), Image.LANCZOS).crop((0, 0, 1040, 430))
          paste_card(c, sett, (50, 70), 22, 14)
          paste_card(c, stats, (830, 70), 22, 14)
          paste_card(c, cont, (310, 420), 22, 14)
          c.convert('RGB').save(public / 'showcase-business.webp', 'WEBP', quality=86, method=6)
          PY

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/showcase-operations.webp public/showcase-business.webp
          if git diff --cached --quiet; then
            echo 'No asset changes.'
          else
            git commit -m 'Add cleaned real Przydas product screenshots'
            git push
          fi
