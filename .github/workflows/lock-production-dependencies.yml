name: Lock production dependencies

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lock-production-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: lock-production-dependencies-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node 24.12
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Create lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > audit.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize audit
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json','utf8'));
          const rows = Object.entries(report.vulnerabilities || {})
            .filter(([,v]) => ['high','critical'].includes(String(v?.severity || '').toLowerCase()))
            .map(([name,v]) => {
              const via=(v.via||[]).map(x=>typeof x==='string'?x:(x.title||x.url||x.source)).filter(Boolean);
              const fix=v.fixAvailable===true?'tak':v.fixAvailable&&typeof v.fixAvailable==='object'?`${v.fixAvailable.name||name}@${v.fixAvailable.version||'?'}`:'brak automatycznej informacji';
              return `- **${name}** — ${v.severity}; direct=${Boolean(v.isDirect)}; fix=${fix}${via.length?`; via: ${via.slice(0,4).join(' / ')}`:''}`;
            });
          const body=['# Website dependency audit','',`Commit: ${process.env.GITHUB_SHA}`,'',...(rows.length?rows:['- brak HIGH/CRITICAL'])].join('\n');
          fs.writeFileSync('audit-summary.md',body);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,body+'\n');
          NODE

      - name: Publish audit issue
        if: ${{ steps.audit.outputs.exit_code != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Website dependency security audit is failing'
          issue="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file audit-summary.md
          else
            gh issue create --title "$title" --body-file audit-summary.md
          fi

      - name: Build website
        if: ${{ steps.audit.outputs.exit_code == '0' }}
        run: npm run build

      - name: Commit verified lockfile
        if: ${{ steps.audit.outputs.exit_code == '0' }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock website production dependencies'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce audit gate
        if: always()
        env:
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          if [ "${AUDIT_EXIT:-1}" != '0' ]; then
            echo 'HIGH/CRITICAL website dependency vulnerabilities remain.'
            exit 1
          fi
