name: Update Przydas product marketing 2026-09-02

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-product-marketing-20260902.py'
      - '.github/workflows/update-product-marketing-20260902.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Apply marketing update
        run: python3 scripts/update-product-marketing-20260902.py
      - name: Install dependencies
        run: npm install
      - name: Build site
        run: npm run build
      - name: Validate copy and package split
        run: |
          test -s dist/index.html
          grep -q 'Koniec ze żmudnym rozliczaniem pracowników' dist/index.html
          grep -q 'Rozliczenia pracowników naliczane według Twoich stawek' dist/index.html
          grep -q 'Czy Przydaś naprawdę liczy wypłaty pracowników?' dist/index.html
          grep -q 'Rozliczenia pracowników i naliczanie wypłat' dist/index.html
          grep -q 'Formularz dla klienta bez przepisywania' dist/index.html
          ! grep -q 'Stanowiska, zadania i rozliczenia pracowników' dist/index.html
          ! grep -q "\['Rozliczenia pracowników', '—', '✓', '✓'\]" src/components/FinalSections.astro
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LandingTop.astro src/components/ProductShowcase.astro src/components/PackagesSection.astro src/components/FinalSections.astro src/pages/index.astro
          git commit -m "Update landing page for employee settlements and new workflows"
          git pull --rebase origin main
          git push origin HEAD:main
